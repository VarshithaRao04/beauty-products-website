<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        .container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
        #message {
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <button onclick="handleLogin()">Login</button>
        <div id="message"></div>
    </div>

    <script>
        // Predefined users for authentication (replace with backend in real apps)
        const validUsers = {
            "user@example.com": "password123",
            "admin@example.com": "admin456"
        };

        function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            // Reset message
            messageDiv.innerHTML = '';

            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                messageDiv.innerHTML = 'Please enter a valid email address';
                messageDiv.style.color = 'red';
                return;
            }

            // Authentication check
            if (validUsers[email] && validUsers[email] === password) {
                messageDiv.innerHTML = 'Login successful!';
                messageDiv.style.color = 'green';
                // Optional: Redirect or further action here
                // window.location.href = 'dashboard.html';
            } else {
                messageDiv.innerHTML = 'Invalid email or password';
                messageDiv.style.color = 'red';
            }
        }
    </script>
</body>
</html>
