    /* Sidebar styling */
    .sidebar {

      padding: 20px;
      height: 100vh;
      overflow-y: auto;
    }
    body {
      background-color: #FAF0E6; /* Beige */
    }

    /* Color swatches styling */
    .color-swatch {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
      border: 1px solid #ccc;
      cursor: pointer;
    }
    .color-swatch.active {
      border: 2px solid #000;
    }
    /* Card hover effect */
    .product-card {
      cursor: pointer;
      transition: transform 0.2s;
    }
    .product-card:hover {
      transform: scale(1.02);
    }
    .add-cart-btn {
      background-color: #ff4d79;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
    }
    .add-cart-btn:hover {
      background-color: #e60050;
    }

      {id:114, name:'Leave-In Conditioner', gender:['female'], category:'Shampoos & Conditioners', price:23, rating:4, color:'beige', skinType:'oily', image:'images/Leave-In_Conditioner.webp'}, 
      {id:115, name:'Keratin Shampoo', gender:['female'], category:'Shampoos & Conditioners', price:25, rating:5, color:'brown', skinType:'dry', image:'images/Keratin_Shampoo.webp'}, 
      {id:116, name:'Tea Tree Shampoo', gender:['male','female'], category:'Shampoos & Conditioners', price:20, rating:4, color:'green', skinType:'sensitive', image:'images/TeaTree_Shampoo.jpg'}, 
      {id:117, name:'Sulfate-Free Conditioner', gender:['female'], category:'Shampoos & Conditioners', price:24, rating:5, color:'lavender', skinType:'combination', image:'images/Sulfate-Free_Conditioner.jpg'}


    ];
    // Filter Options
    const filterOptions = {
      gender: ["male", "female"],
      categories: [
        "Bath & Shower", "Deodorants & Body Sprays", "Eyes, Face & Body Care", "Feminine Hygiene",
        "Fragrance Sets", "Fragrances & Deodorants", "Haircare", "Hair Care Accessories", "Hair Styling",
        "Lips", "Makeup", "Nails", "Shampoos & Conditioners", "Skin Care"
      ],
      rating: [5, 4, 3],
      colors: ["red", "blue", "green", "pink", "purple", "silver", "white","black","beige"],
      skinType: ["oily", "dry", "combination", "sensitive", "normal"]
    };

    // Global Filter State
    let filterState = {
      gender: [],
      categories: [],
      priceMin: null,
      priceMax: null,
      rating: [],
      color: [],
      skinType: []
    };
    function addToCart(productName, price, imageSrc) {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.push({ name: productName, price: price, image: imageSrc });
    localStorage.setItem("cart", JSON.stringify(cart));
    window.location.href = "beautyproducts_cart.html";
    }

    // Render Filter Options for a Filter Type
    function renderOptions(filterType) {
      let html = `<h2>${filterType.charAt(0).toUpperCase() + filterType.slice(1)} Options</h2>`;
      html += `<div class="my-3">`;

      if (filterType === "gender" || filterType === "categories" || filterType === "skinType") {
        filterOptions[filterType].forEach(option => {
          html += `
            <div class="form-check">
              <input class="form-check-input filter-${filterType}" type="checkbox" value="${option}" id="${filterType}${option}">
              <label class="form-check-label" for="${filterType}${option}">${option}</label>
            </div>
          `;
        });
      } else if (filterType === "rating") {
        filterOptions.rating.forEach(rating => {
          html += `
            <div class="form-check">
              <input class="form-check-input filter-rating" type="checkbox" value="${rating}" id="rating${rating}">
              <label class="form-check-label" for="rating${rating}">${rating} Stars & Up</label>
            </div>
          `;
        });
      } else if (filterType === "colors") {
        filterOptions.colors.forEach(color => {
          html += `<span class="color-swatch filter-color" data-color="${color}" style="background-color: ${color};" title="${color}"></span>`;
        });
      } else if (filterType === "price") {
        html += `
          <div class="mb-2">
            <label for="priceMin" class="form-label">Min Price ($)</label>
            <input type="number" class="form-control filter-price-min" id="priceMin" placeholder="0">
          </div>
          <div>
            <label for="priceMax" class="form-label">Max Price ($)</label>
            <input type="number" class="form-control filter-price-max" id="priceMax" placeholder="1000">
          </div>
        `;
      }
      html += `</div>`;
      document.getElementById("contentArea").innerHTML = html;

      // Attach event listeners for filter options
      if (filterType === "gender" || filterType === "categories" || filterType === "skinType" || filterType === "rating") {
        document.querySelectorAll(`.filter-${filterType}`).forEach(input => {
          input.addEventListener("change", function () {
            filterState[filterType] = Array.from(document.querySelectorAll(`.filter-${filterType}:checked`)).map(el => el.value);
            filterAndRenderProducts();
          });
        });
      } else if (filterType === "colors") {
        document.querySelectorAll(".filter-color").forEach(swatch => {
          swatch.addEventListener("click", function () {
            this.classList.toggle("active");
            filterState.color = Array.from(document.querySelectorAll(".filter-color.active")).map(el => el.getAttribute("data-color"));
            filterAndRenderProducts();
          });
        });
      } else if (filterType === "price") {
        document.querySelectorAll(".filter-price-min, .filter-price-max").forEach(input => {
        input.addEventListener("input", function () {
          const minInput = document.querySelector(".filter-price-min").value;
          const maxInput = document.querySelector(".filter-price-max").value;
    filterAndRenderProducts();
  });
});

      }
    }

    // Filter Products Based on filterState
    function filterAndRenderProducts() {
      const filteredProducts = allProducts.filter(product => {
        if (filterState.gender.length && !filterState.gender.some(g => product.gender.includes(g))) return false;
        if (filterState.categories.length && !filterState.categories.includes(product.category)) return false;
        if (filterState.rating.length && !filterState.rating.some(r => product.rating >= r)) return false;
        if (filterState.color.length && !filterState.color.includes(product.color)) return false;
        if (filterState.skinType.length && !filterState.skinType.includes(product.skinType)) return false;
        return true;
      });
      renderProducts(filteredProducts);
    }

    // Render Filtered Products
    function renderProducts(products) {
      let html = `<h2>Filtered Products</h2>`;
      if (products.length === 0) {
        html += `<p>No products match the selected filters.</p>`;
      } else {
        html += `<div class="row">`;
        products.forEach(product => {
          html += `
            <div class="col-md-4 mb-3 product-card">
              <div class="card h-100">
                <img src="${product.image}" class="card-img-top" alt="${product.name}">
                <div class="card-body">
                  <h5 class="card-title">${product.name}</h5>
                  <p class="card-text">${product.category}</p>
                  <p class="card-text">$${product.price}</p>
                  <p class="card-text">Rating: ${product.rating} Stars</p>
                  <button class="add-cart-btn" onclick="addToCart('${product.name}', ${product.price}, '${product.image}')">Add to Cart</button>
                </div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }
      document.getElementById("contentArea").innerHTML = html;
    }

    // Event Listeners for Filter Types
    document.getElementById("filterGender").addEventListener("click", () => renderOptions("gender"));
    document.getElementById("filterCategories").addEventListener("click", () => renderOptions("categories"));
    document.getElementById("filterRating").addEventListener("click", () => renderOptions("rating"));
    document.getElementById("filterColors").addEventListener("click", () => renderOptions("colors"));
    document.getElementById("filterSkinType").addEventListener("click", () => renderOptions("skinType"));

    // Reset Filters
    document.getElementById("resetFilters").addEventListener("click", function () {
      filterState = {
        gender: [],
        categories: [],
        rating: [],
        color: [],
        skinType: []
      };
      renderOptions("gender"); // Reset to default filter type
      filterAndRenderProducts();
    });
  
  </script>
